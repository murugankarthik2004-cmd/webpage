```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik's Webpage</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-box {
            width: 350px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        #error {
            color: red;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        #welcomePage {
            display: none;
            text-align: center;
            color: white;
        }

        #welcomePage h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        #welcomePage p {
            font-size: 22px;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="login-box" id="loginBox">

        <h2>Login</h2>

        <form onsubmit="login(event)">

            <label>Mail ID</label>
            <input
                type="text"
                id="email"
                placeholder="Enter mail ID"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Login</button>

            <p id="error">Invalid Mail ID or Password!</p>

        </form>
    </div>

    <!-- WELCOME -->
    <div id="welcomePage">

        <h1>Hi Karthik! 👋</h1>

        <p>Welcome to my webpage</p>

    </div>

    <script>
        function login(event) {

            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            // Login credentials
            if (email === "karthik@2000" && password === "1234") {

                document.getElementById("loginBox").style.display = "none";
                document.getElementById("welcomePage").style.display = "block";

            } else {

                document.getElementById("error").style.display = "block";

            }
        }
    </script>

</body>
</html>
