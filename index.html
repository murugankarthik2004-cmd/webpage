<!DOCTYPE html>
<html>
<head>
    <title>Karthik's Webpage</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .login-box {
            width: 500px;
            padding: 60px;
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 22px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #error {
            display: none;
            color: red;
            text-align: center;
            margin-top: 15px;
        }

        #welcomePage {
            display: none;
            text-align: center;
        }

        #welcomePage h1 {
            color: #333;
            font-size: 40px;
        }

        #welcomePage p {
            color: #555;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <!-- Login -->
    <div class="login-box" id="loginBox">

        <h2>Login</h2>

        <form onsubmit="login(event)">

            <label>Mail ID</label>
            <input type="text"
                   id="email"
                   placeholder="Enter mail ID"
                   required>

            <label>Password</label>
            <input type="password"
                   id="password"
                   placeholder="Enter password"
                   required>

            <button type="submit">Login</button>

            <p id="error">Invalid Mail ID or Password!</p>

        </form>

    </div>

    <!-- Welcome -->
    <div id="welcomePage">

        <h1>Hi Karthik! 👋</h1>

        <p>Welcome to my webpage</p>

    </div>

    <script>

        function login(event) {

            event.preventDefault();

            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let error = document.getElementById("error");

            if (email === "karthik@2000" && password === "1234") {

                document.getElementById("loginBox").style.display = "none";

                document.getElementById("welcomePage").style.display = "block";

                error.style.display = "none";

            } else {

                error.style.display = "block";

            }
        }

    </script>

</body>
</html>
